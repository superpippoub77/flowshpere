name: Deploy FlowSphere to Aruba

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE: /projects/flowshpere/api
        run: |
          npm install
          npm run build

      - name: Save artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: frontend/dist/

  deploy-frontend:
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-files
          path: dist/

      - name: Deploy frontend to Aruba
        uses: SamKirkland/FTP-Deploy-Action@v4.3.0
        with:
          server: ftp.filippomorano.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /www.filippomorano.com/projects/flowshpere/

  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy backend PHP to Aruba
        uses: SamKirkland/FTP-Deploy-Action@v4.3.0
        with:
          server: ftp.filippomorano.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./backend-php/
          server-dir: /www.filippomorano.com/projects/flowshpere/api/
          exclude: |
            **/data/*.sqlite
